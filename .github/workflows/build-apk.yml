name: Build APK

on:
  push:
    branches: [claude/setup-react-native-expo-zYWmj, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK (JS bundled in)
        working-directory: android
        run: ./gradlew assembleDebug -PbundleInDebug=true --no-daemon

      - name: Upload APK as artifact (14-day download)
        uses: actions/upload-artifact@v4
        with:
          name: chess-coach-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-build-${{ github.run_number }}
          name: Debug Build #${{ github.run_number }}
          body: |
            Automated debug build from commit ${{ github.sha }}.
            Download `app-debug.apk` below and install directly on Android
            (enable "Install from unknown sources" in settings first).
          prerelease: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
