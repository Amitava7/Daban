apply plugin: 'expo-module-gradle-plugin'

group = 'expo.modules.stockfish'
version = '0.1.0'

android {
  namespace 'expo.modules.stockfish'

  defaultConfig {
    // Targeting the Galaxy S24 Ultra only (arm64-v8a). Other ABIs are skipped
    // to keep the Stockfish build small and fast.
    ndk {
      abiFilters 'arm64-v8a'
    }
    externalNativeBuild {
      cmake {
        cppFlags '-std=c++17', '-O3', '-fexceptions', '-frtti'
        arguments '-DANDROID_STL=c++_shared'
      }
    }
  }

  externalNativeBuild {
    cmake {
      path 'CMakeLists.txt'
      version '3.22.1'
    }
  }
}
