apply plugin: 'expo-module-gradle-plugin'

group = 'expo.modules.stockfish'
version = '0.1.0'

android {
  namespace 'expo.modules.stockfish'

  defaultConfig {
    // Required by expo-module-gradle-plugin's publication setup.
    versionCode 1
    versionName '0.1.0'

    // Targeting the Galaxy S24 Ultra only (arm64-v8a). Other ABIs are skipped
    // to keep the Stockfish build small and fast.
    ndk {
      abiFilters 'arm64-v8a'
    }
    externalNativeBuild {
      cmake {
        cppFlags '-std=c++17', '-O3', '-fexceptions', '-frtti'
        // Which NNUE net gets baked into libstockfish.so: 'small' (3.3 MB,
        // the default) or 'big' (adds the stock 65 MB net back). See
        // docs/APK_SIZE.md. Override with -Pdaban.stockfishNet=big or a line
        // in android/gradle.properties.
        arguments '-DANDROID_STL=c++_shared',
                  "-DSTOCKFISH_NET=${project.findProperty('daban.stockfishNet') ?: 'small'}"
      }
    }
  }

  externalNativeBuild {
    cmake {
      path 'CMakeLists.txt'
      version '3.22.1'
    }
  }
}
